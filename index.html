<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Printable Deck of Cards</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <h1>Printable Deck of Cards</h1>
        <p>A full 52-card deck, ready to print. Enter a theme to generate custom card art!</p>
        <div class="controls">
            <input type="text" id="theme-input" placeholder="Enter a theme (e.g., space, fantasy, cats)">
            <button id="generate-btn">Generate Theme</button>
            <button id="reset-btn">Reset Deck</button>
            <button id="print-btn">Print Cards</button>
        </div>
        <div id="loader" class="hidden">
            <div class="spinner"></div>
            <p>Generating card art... this may take a moment.</p>
            <p id="progress-text"></p>
        </div>
    </header>

    <main id="card-deck">
        <!-- Cards will be generated by JavaScript here -->
    </main>

    <script type="importmap">
    {
      "imports": {
        "./script.js": "./script.js",
        "./constants.js": "./constants.js",
        "./utils.js": "./utils.js",
        "./api.js": "./api.js",
        "./ui.js": "./ui.js",
        "./theme.js": "./theme.js"
      }
    }
    </script>
    <script type="module" src="script.js"></script>

</body>
</html>
